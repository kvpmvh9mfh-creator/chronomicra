<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomicra - מערכת סריקה ארכיאולוגית</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 400px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Chronomicra - סורק ארכיאולוגי</h1>
        
        <div id="map" class="mb-6 border-2 border-gray-200"></div>

        <div class="space-y-4">
            <input type="file" id="fileInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
            
            <button id="btnAnalyze" class="w-full py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition">
                ניתוח סריקה
            </button>
        </div>

        <div id="loadingSection" class="hidden mt-6 p-4 bg-yellow-50 text-yellow-800 rounded-xl border border-yellow-200 text-center">
            <p id="loadingText">מעבד נתונים...</p>
        </div>

        <div id="results" class="hidden mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200">
            <h2 class="text-lg font-bold mb-2">תוצאות ניתוח:</h2>
            <ul id="tagsList" class="list-disc pr-5 space-y-2 text-gray-700"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js";

        // אתחול Firebase
        const app = initializeApp(JSON.parse(__firebase_config));
        const auth = getAuth(app);
        const storage = getStorage(app);
        const functions = getFunctions(app, "us-east1");
        const processScan = httpsCallable(functions, "scanProcessor");

        // מפה: התחלה בזום 8
        const map = L.map('map').setView([31.7, 34.8], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marker, selectedFile;
        const btnAnalyze = document.getElementById('btnAnalyze');
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('change', (e) => selectedFile = e.target.files[0]);

        btnAnalyze.addEventListener('click', async () => {
            if (!selectedFile) return alert("אנא בחר קובץ סריקה");

            document.getElementById('loadingSection').classList.remove('hidden');
            
            try {
                const reportId = "scan_" + Date.now();
                const storagePath = "scans/" + reportId + ".jpg";
                await uploadBytes(ref(storage, storagePath), selectedFile);

                const result = await processScan({
                    reportId,
                    filePath: storagePath,
                    location: { lat: 31.7, lng: 34.8 }
                });

                document.getElementById('results').classList.remove('hidden');
                document.getElementById('loadingSection').classList.add('hidden');
                
                const list = document.getElementById('tagsList');
                list.innerHTML = result.data.ai_tags.map(tag => `<li>${tag}</li>`).join('');
                
                // עדכון מפה לאתר
                if (marker) map.removeLayer(marker);
                marker = L.marker([31.7, 34.8]).addTo(map);
                map.setView([31.7, 34.8], 12);
            } catch (err) {
                alert("שגיאה בתהליך: " + err.message);
            }
        });
    </script>
</body>
</html>
