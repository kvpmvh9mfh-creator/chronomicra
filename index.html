                if(!this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();

                osc.frequency.setValueAtTime(150, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 1.5);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);
                osc.start(this.ctx.currentTime); osc.stop(this.ctx.currentTime + 1.5);
            }
        }
        const audio = new SoundEngine();

        // --- SUB-COMPONENTS ---
        const LiveClock = ({ stats, lang, t }) => {
            const size = 260; const center = size / 2; const strokeWidth = 4;
            const rJub = 110; const cJub = 2 * Math.PI * rJub; const offJub = cJub - (stats.yearInJubilee / 50) * cJub;
            const rShm = 85; const cShm = 2 * Math.PI * rShm; const offShm = cShm - (stats.shmitaYear / 7) * cShm;
            const rMod = 60; const cMod = 2 * Math.PI * rMod; const offMod = cMod - (stats.modulo100 / 100) * cMod;

            return (
                <div className="w-full bg-slate-900/50 border-y border-cyan-900/30 py-12">
                    <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-8">
                        <div className="flex-1 text-center md:text-start">
                            <div className="text-cyan-500 font-mono-sci text-xs font-bold tracking-widest mb-2 flex items-center gap-2 justify-center md:justify-start">
                                <span className="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span> {t.clock.title}
                            </div>
                            <h2 className="text-3xl font-title font-bold text-white mb-2">{t.clock.subtitle}</h2>
                            <p className="text-slate-400 mb-6">{t.clock.course}: <span className="text-cyan-400 font-bold ml-2">{lang === 'he' ? stats.courseHe : stats.courseEn}</span></p>
                            
                            <div className="flex gap-4 justify-center md:justify-start">
                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center w-28 glow-box-cyan">
                                    <div className="text-[10px] text-cyan-600 font-bold mb-1">{t.clock.jubilee}</div>
                                    <div className="font-mono-sci text-2xl text-cyan-400">{stats.currentJubileeCycle}</div>
                                </div>
                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center w-28 shadow-[0_0_15px_rgba(139,92,246,0.1)]">
                                    <div className="text-[10px] text-purple-500 font-bold mb-1">{t.clock.shmita}</div>
                                    <div className="font-mono-sci text-2xl text-purple-400">{stats.shmitaYear}/7</div>
                                </div>
                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center w-28 glow-box-cyan">
                                    <div className="text-[10px] text-cyan-600 font-bold mb-1">{t.clock.yearInJub}</div>
                                    <div className="font-mono-sci text-2xl text-cyan-400">{stats.yearInJubilee}/50</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative flex justify-center items-center shrink-0">
                            <svg width={size} height={size} className="transform -rotate-90 filter drop-shadow-[0_0_8px_rgba(6,182,212,0.3)]">
                                <circle cx={center} cy={center} r={rJub} stroke="rgba(6,182,212,0.1)" strokeWidth={strokeWidth} fill="none" />
                                <circle cx={center} cy={center} r={rJub} stroke="#06b6d4" strokeWidth={strokeWidth} className="ring-circle" strokeDasharray={cJub} strokeDashoffset={offJub} />
                                <circle cx={center} cy={center} r={rShm} stroke="rgba(139,92,246,0.1)" strokeWidth={strokeWidth} fill="none" />
                                <circle cx={center} cy={center} r={rShm} stroke="#8b5cf6" strokeWidth={strokeWidth} className="ring-circle" strokeDasharray={cShm} strokeDashoffset={offShm} />
                                <circle cx={center} cy={center} r={rMod} stroke="rgba(56,189,248,0.1)" strokeWidth={strokeWidth} fill="none" />
                                <circle cx={center} cy={center} r={rMod} stroke="#38bdf8" strokeWidth={strokeWidth} className="ring-circle" strokeDasharray={cMod} strokeDashoffset={offMod} />
                            </svg>
                            <div className="absolute flex flex-col items-center justify-center text-center">
                                <span className="text-[9px] text-cyan-500/70 tracking-widest uppercase">{t.clock.jdnNow}</span>
                                <span className="text-xl font-mono-sci glow-text-cyan font-bold mt-1">{stats.jdn}</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DiscoveryTriad = ({ t }) => {
            return (
                <section id="about" className="py-24 px-6 bg-[#040b16] border-b border-slate-800/50">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-title font-bold text-white mb-4">{t.triad.title}</h2>
                            <p className="text-slate-400 max-w-2xl mx-auto text-lg">{t.triad.subtitle}</p>
                        </div>
                        
                        <div className="grid lg:grid-cols-3 gap-8">
                            <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl hover:border-cyan-500/50 transition-colors group">
                                <div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mb-6 group-hover:bg-cyan-900/50 transition-colors">
                                    <i data-lucide="moon" className="w-7 h-7 text-slate-400 group-hover:text-cyan-400"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white mb-3">{t.triad.astro}</h3>
                                <p className="text-slate-400 text-sm leading-relaxed">{t.triad.astroDesc}</p>
                            </div>
                            <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl hover:border-rose-500/50 transition-colors group">
                                <div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mb-6 group-hover:bg-rose-900/50 transition-colors">
                                    <i data-lucide="flask-conical" className="w-7 h-7 text-slate-400 group-hover:text-rose-400"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white mb-3">{t.triad.c14}</h3>
                                <p className="text-slate-400 text-sm leading-relaxed">{t.triad.c14Desc}</p>
                            </div>
                            <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl hover:border-emerald-500/50 transition-colors group relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-500/10 blur-2xl rounded-full"></div>
                                <div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mb-6 group-hover:bg-emerald-900/50 transition-colors relative z-10">
                                    <i data-lucide="book-open" className="w-7 h-7 text-slate-400 group-hover:text-emerald-400"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white mb-3 relative z-10">{t.triad.text}</h3>
                                <p className="text-slate-400 text-sm leading-relaxed relative z-10">{t.triad.textDesc}</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('he'); 
            const [clockStats, setClockStats] = useState(null);
            
            useEffect(() => {
                document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
                lucide.createIcons();
                setClockStats(calculateCycles(new Date()));
                const timer = setInterval(() => setClockStats(calculateCycles(new Date())), 60000);
                return () => clearInterval(timer);
            }, [lang]);

            const t = translations[lang];
            const fontClass = lang === 'he' ? 'font-he' : 'font-en';

            const [selectedEventId, setSelectedEventId] = useState(timelineDB[0].id);
            const [syncState, setSyncState] = useState('unsynced');
            
            const selectedEvent = timelineDB.find(e => e.id === selectedEventId);
            const eventContent = selectedEvent[lang];

            const particles = useMemo(() => Array.from({ length: 50 }).map((_, i) => ({ id: i, startX: (Math.random() - 0.5) * 320, startY: (Math.random() - 0.5) * 180, delay: Math.random() * 0.5 })), [selectedEvent.id]);

            const handleSync = () => {
                audio.init(); 
                if(syncState === 'synced') { setSyncState('animating_unsync'); audio.playUnsync(); setTimeout(() => setSyncState('unsynced'), 1500); return; }
                if(syncState === 'unsynced') { setSyncState('animating_sync'); audio.playCharge(); setTimeout(() => { setSyncState('synced'); audio.playLock(); }, 2500); }
            };

            if (!clockStats) return null;

            return (
                <div className={`min-h-screen ${fontClass}`}>
                    
                    {/* NAVBAR */}
                    <nav className="fixed w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-cyan-900/30">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i data-lucide="infinity" className="w-6 h-6 text-cyan-400"></i>
                                <span className="font-title text-2xl font-bold tracking-[0.2em] text-white" dir="ltr">CHRONOMICRA</span>
                            </div>
                            <div className="hidden md:flex gap-6 text-sm font-semibold text-slate-400">
                                <a href="#about" className="hover:text-cyan-400 transition-colors">{t.nav.model}</a>
                                <a href="#simulator" className="hover:text-cyan-400 transition-colors">{t.nav.simulator}</a>
                                <a href="archeologin.html" className="hover:text-cyan-400 transition-colors">{t.nav.researchers}</a>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setLang(l => l === 'he' ? 'en' : 'he')} className="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-1.5 rounded-md border border-slate-700 text-sm font-bold transition">
                                    <span className="text-lg leading-none">{lang === 'he' ? '🇺🇸' : '🇮🇱'}</span>
                                    <span>{lang === 'he' ? 'EN' : 'עברית'}</span>
                                </button>
                                <a href="archeologin.html" className="hidden sm:block bg-cyan-600/20 text-cyan-400 border border-cyan-500/50 px-4 py-1.5 rounded text-sm font-semibold hover:bg-cyan-600/40 transition">
                                    {t.nav.portal}
                                </a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="relative pt-32 pb-16 px-6 bg-grid-subtle">
                        <div className="max-w-4xl mx-auto text-center relative z-10">
                            <div className="inline-block bg-cyan-950/50 border border-cyan-800/50 rounded-full px-4 py-1.5 mb-6">
                                <span className="text-xs font-mono-sci text-cyan-400 font-bold uppercase tracking-widest">{t.hero.badge}</span>
                            </div>
                            <h1 className="text-5xl lg:text-7xl font-title font-bold text-white mb-6 leading-tight">
                                {t.hero.title1} <br/>
                                <span className="glow-text-cyan text-cyan-400">{t.hero.title2}</span>
                            </h1>
                            <p className="text-lg lg:text-xl text-slate-400 font-light mb-10 max-w-2xl mx-auto leading-relaxed">
                                {t.hero.desc}
                            </p>
                        </div>
                    </section>

                    {/* CLOCK & TRIAD */}
                    <LiveClock stats={clockStats} lang={lang} t={t} />
                    <DiscoveryTriad t={t} />

                    {/* SIMULATOR */}
                    <section id="simulator" className="py-24 relative bg-[#020617] overflow-hidden">
                        <div className={`absolute inset-0 bg-grid-active ${syncState === 'synced' ? 'active' : ''}`}></div>
                        <div className="max-w-6xl mx-auto px-6 relative z-10 flex flex-col items-center">
                            
                            <div className="text-center mb-10">
                                <span className="text-cyan-500 font-mono-sci tracking-widest uppercase text-xs font-bold mb-2 block">{t.sim.demo}</span>
                                <h2 className="text-4xl font-title font-bold text-white mb-4">{t.sim.title}</h2>
                                <p className="text-slate-400 max-w-2xl">{t.sim.desc}</p>
                            </div>

                            <div className="w-full overflow-x-auto hide-scrollbar mb-10 pb-4">
                                <div className="flex gap-4 min-w-max px-4">
                                    {timelineDB.map(ev => (
                                        <div key={ev.id} onClick={() => { if(syncState === 'unsynced') { setSelectedEventId(ev.id); } }}
                                            className={`cursor-pointer w-64 p-4 rounded-xl border transition-all duration-300 flex flex-col ${selectedEvent.id === ev.id ? 'bg-cyan-900/40 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.3)]' : 'bg-slate-900/60 border-slate-800 hover:bg-slate-800'} ${syncState !== 'unsynced' ? 'opacity-50 pointer-events-none' : ''}`}>
                                            <div className="text-xs font-mono-sci text-cyan-500 mb-2">{ev[lang].interval}</div>
                                            <div className={`font-bold text-lg leading-tight ${selectedEvent.id === ev.id ? 'text-white' : 'text-slate-400'}`}>{ev[lang].name}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className={`w-full max-w-4xl h-80 bg-[#01030a] border border-slate-800 rounded-2xl relative flex flex-col justify-between p-6 mb-8 glow-box-cyan overflow-hidden sync-state-${syncState}`} dir="ltr">
                                <div className="absolute top-0 bottom-0 left-1/2 w-px bg-cyan-900/50 -translate-x-1/2"></div>
                                <div className="absolute top-1/2 left-1/2 w-6 h-6 -ml-3 -mt-3 rounded-full border border-cyan-800 z-10"></div>
                                <div className="eclipse-container"><div className="eclipse-sun"></div><div className="eclipse-moon"></div></div>

                                {particles.map(p => {
                                    const isSynced = syncState === 'synced' || syncState === 'animating_sync';
                                    const style = {
                                        transform: isSynced && syncState === 'synced' ? `translate(0px, 0px) scale(0)` : `translate(${p.startX}px, ${p.startY}px) scale(${Math.random() * 0.5 + 0.5})`,
                                        transitionDelay: isSynced && syncState === 'synced' ? `${p.delay}s` : '0s', transitionDuration: syncState === 'animating_unsync' ? '1.5s' : '2.5s',
                                        backgroundColor: (syncState === 'synced') ? '#06b6d4' : '#f43f5e', boxShadow: (syncState === 'synced') ? '0 0 10px #06b6d4' : '0 0 5px #f43f5e',
                                        opacity: syncState === 'animating_sync' ? 0.3 : ((syncState === 'synced') ? 0 : 0.6), zIndex: (syncState === 'synced') ? 1 : 10
                                    };
                                    return <div key={p.id} className="particle absolute top-1/2 left-1/2 w-2 h-2 -ml-1 -mt-1 rounded-full" style={style}></div>;
                                })}

                                <div className={`absolute top-1/2 left-1/2 w-16 h-16 -ml-8 -mt-8 rounded-full bg-cyan-400/20 blur-xl transition-all duration-1000 ${syncState === 'synced' ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}></div>

                                <div className={`absolute left-6 top-6 text-xs font-mono-sci font-bold tracking-widest text-left transition-opacity duration-500 ${syncState === 'unsynced' ? 'text-rose-400 opacity-100' : 'opacity-0'}`}>
                                    {t.sim.statusMyth}<br/><span className="text-[10px] text-slate-500">{t.sim.statusMythSub}</span>
                                </div>
                                <div className={`absolute left-6 top-6 text-xs font-mono-sci font-bold tracking-widest text-left transition-opacity duration-500 text-amber-400 ${syncState === 'animating_sync' ? 'opacity-100' : 'opacity-0'}`}>
                                    {t.sim.statusCalc}<br/><span className="text-[10px] text-slate-500">{t.sim.statusCalcSub}</span>
                                </div>
                                <div className={`absolute left-6 top-6 text-xs font-mono-sci font-bold tracking-widest text-left transition-opacity duration-500 text-purple-400 ${syncState === 'animating_unsync' ? 'opacity-100' : 'opacity-0'}`}>
                                    {t.sim.statusUnsync}<br/><span className="text-[10px] text-slate-500">{t.sim.statusUnsyncSub}</span>
                                </div>
                                <div className={`absolute left-6 top-6 text-xs font-mono-sci font-bold tracking-widest text-left transition-opacity duration-500 glow-text-cyan ${syncState === 'synced' ? 'text-cyan-400 opacity-100' : 'opacity-0'}`}>
                                    {t.sim.statusFact}<br/><span className="text-[10px] text-cyan-700">{t.sim.statusFactSub}</span>
                                </div>
                            </div>

                            {/* READOUT PANELS & TABLE */}
                            <div className="w-full max-w-4xl grid lg:grid-cols-2 gap-6 items-stretch mb-12">
                                <div className="flex flex-col gap-4">
                                    <div className={`p-6 rounded-xl border transition-all duration-500 flex-1 flex flex-col justify-center ${syncState === 'unsynced' || syncState === 'animating_unsync' ? 'border-rose-900/50 bg-rose-950/10' : 'border-slate-800 bg-slate-900/30 grayscale opacity-40'}`}>
                                        <div className="text-xs uppercase text-slate-500 mb-2 font-mono-sci">{t.sim.mythLabel}</div>
                                        <div className={`text-xl font-mono-sci font-bold mb-2 ${syncState === 'unsynced' || syncState === 'animating_unsync' ? 'glow-text-red text-rose-400' : 'text-slate-500'}`} dir="ltr">{eventContent.mythRange}</div>
                                        <div className={`text-sm leading-relaxed ${syncState === 'unsynced' || syncState === 'animating_unsync' ? 'text-rose-200' : 'text-slate-500'}`}>{eventContent.mythText}</div>
                                    </div>
                                    
                                    <div className={`p-6 rounded-xl border transition-all duration-500 flex-1 flex flex-col justify-center ${syncState === 'synced' ? 'border-cyan-500/50 bg-cyan-950/20 glow-box-cyan' : 'border-slate-800 bg-slate-900/30'}`}>
                                        <div className="text-xs uppercase text-slate-500 mb-2 font-mono-sci">{t.sim.factLabel}</div>
                                        <div className={`text-xl font-mono-sci font-bold mb-2 ${syncState === 'synced' ? 'glow-text-cyan text-cyan-400' : 'text-slate-600'}`} dir="ltr">{eventContent.factRange}</div>
                                        <div className={`text-sm leading-relaxed mb-4 transition-opacity ${syncState === 'synced' ? 'text-cyan-100 opacity-100' : 'text-slate-600 opacity-20'}`}>{eventContent.factText}</div>
                                        
                                        <div className={`flex flex-wrap gap-4 pt-3 border-t transition-opacity duration-500 ${syncState === 'synced' ? 'border-cyan-900/50 opacity-100' : 'border-slate-800 opacity-0'}`}>
                                            <div className="text-xs">
                                                <span className="text-slate-500 block mb-1">{t.sim.anchorLabel}</span>
                                                <span className="text-cyan-400 font-mono-sci font-semibold">{selectedEvent.anchor}</span>
                                            </div>
                                            <div className="text-xs font-bold">
                                                <span className="text-slate-500 block mb-1">{t.sim.aIndexLabel}</span>
                                                <span className="glow-text-emerald font-mono-sci text-emerald-400 text-sm">A_model={selectedEvent.aIndex}%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-4">
                                    <div className="p-6 rounded-xl border border-slate-800 bg-slate-900/30 flex flex-col justify-between flex-1">
                                        <div>
                                            <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
                                                <i data-lucide="binary" className="w-4 h-4 text-cyan-400"></i>
                                                {t.sim.tableTitle}
                                            </h3>
                                            <div className="overflow-x-auto hide-scrollbar">
                                                <table className="w-full text-xs text-right text-slate-400 border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-slate-800 text-slate-500">
                                                            <th className="py-2 text-start">{t.sim.colSample}</th>
                                                            <th className="py-2 px-2">{t.sim.colUnmodelled}</th>
                                                            <th className="py-2 px-2">{t.sim.colModelled}</th>
                                                            <th className="py-2 text-center">{t.sim.colAgreement}</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {selectedEvent.samples.map((s, idx) => (
                                                            <tr key={idx} className="border-b border-slate-800/40 hover:bg-slate-900/20 sample-row">
                                                                <td className="py-3 font-mono-sci text-slate-200 text-start">{s.id}<span className="block text-[10px] text-slate-500 font-sans">{lang === 'he' ? s.en : s.en}</span></td>
                                                                <td className="py-3 px-2 font-mono-sci" dir="ltr">{s.unmodelled}</td>
                                                                <td className="py-3 px-2 font-mono-sci transition-colors duration-500" dir="ltr" style={{ color: syncState === 'synced' ? '#22d3ee' : '#475569' }}>{syncState === 'synced' ? s.modelled : 'Pending...'}</td>
                                                                <td className="py-3 text-center font-mono-sci font-bold transition-colors duration-500" style={{ color: syncState === 'synced' ? '#34d399' : '#475569' }}>{syncState === 'synced' ? s.aComb : '---'}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        
                                        <button onClick={handleSync} disabled={syncState === 'animating_sync' || syncState === 'animating_unsync'} 
                                            className={`w-full mt-6 h-16 rounded-xl font-title font-bold text-xl uppercase tracking-wider transition-all duration-300 ${syncState === 'animating_sync' ? 'bg-amber-600/50 text-amber-200 border border-amber-500/50 cursor-wait' : syncState === 'animating_unsync' ? 'bg-purple-600/50 text-purple-200 border border-purple-500/50 cursor-wait' : syncState === 'synced' ? 'bg-slate-800 text-slate-400 hover:bg-slate-700 border border-slate-700' : 'bg-cyan-600 text-white hover:bg-cyan-500 shadow-[0_0_20px_rgba(6,182,212,0.4)]'}`}>
                                            {syncState === 'animating_sync' ? t.sim.btnCalc : syncState === 'animating_unsync' ? t.sim.btnUnsyncing : syncState === 'synced' ? t.sim.btnReset : t.sim.btnSync}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer id="research" className="border-t border-slate-800/50 bg-[#01030a] py-12 text-center">
                        <div className="flex justify-center items-center gap-2 mb-4">
                            <i data-lucide="infinity" className="w-5 h-5 text-slate-500"></i>
                            <span className="font-title font-bold text-slate-500 tracking-widest" dir="ltr">CHRONOMICRA PROJECT</span>
                        </div>
                        <p className="text-sm text-slate-600 mb-6">{t.footer.desc}</p>
                        <div className="flex justify-center gap-6 text-sm text-cyan-600 font-semibold">
                            <a href="#about" className="hover:text-cyan-400">{t.footer.about}</a>
                            <a href="archeologin.html" className="hover:text-cyan-400 font-bold">{t.footer.archeologin}</a>
                            <a href="#" className="hover:text-cyan-400">{t.footer.contact}</a>
                        </div>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
